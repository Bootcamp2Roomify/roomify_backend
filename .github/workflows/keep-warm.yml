name: Keep live demo warm

# Best effort: Vercel scales the API container to zero after 5 idle minutes, and a cold start makes
# the next visitor wait 10-20 s. GitHub may delay scheduled runs, so cold starts can still happen.
# Disable this workflow after judging.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Ping frontend → API and the CV service
        run: |
          curl -fsS --max-time 60 https://roomify-rooms.vercel.app/api/health
          curl -fsS --max-time 60 -o /dev/null https://roomify-cv.vercel.app/health
