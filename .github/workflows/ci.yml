name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: roomify
          POSTGRES_USER: roomify
          POSTGRES_PASSWORD: roomify_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roomify -d roomify"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: roomify
      DB_USERNAME: roomify
      DB_PASSWORD: roomify_ci
      # Test-only signing secret; never used outside CI.
      JWT_SECRET: ci-only-jwt-secret-ci-only-jwt-secret-0123456789
      STORAGE_TYPE: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - name: Build container image
        run: docker build -t roomify-backend:ci .

  submission-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.4.0"
      - name: Install pandoc and browser dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q pandoc
          cd docs/submission/tooling && npm ci --silent && npx playwright install-deps chromium
      - name: Build submission documents
        run: docs/submission/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: roomify-submission-documents
          path: docs/submission/final/
