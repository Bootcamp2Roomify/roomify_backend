services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_DB: roomify
      POSTGRES_USER: roomify
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomify -d roomify"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: roomify
      DB_USERNAME: roomify
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      PREFERENCES_MAX_BUDGET_AMOUNT: ${PREFERENCES_MAX_BUDGET_AMOUNT:-1000000}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_TTL: ${JWT_TTL:-1h}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_ROOT: ${STORAGE_LOCAL_ROOT:-./storage}
      STORAGE_LOCAL_BUCKET: ${STORAGE_LOCAL_BUCKET:-local}
      ROOM_IMAGE_MAX_SIZE_BYTES: ${ROOM_IMAGE_MAX_SIZE_BYTES:-10485760}
      DESIGN_IMAGE_MAX_SIZE_BYTES: ${DESIGN_IMAGE_MAX_SIZE_BYTES:-10485760}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_CONNECT_TIMEOUT: ${AI_CONNECT_TIMEOUT:-5s}
      AI_READ_TIMEOUT: ${AI_READ_TIMEOUT:-180s}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.1}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-}
      AI_IMAGE_MODEL: ${AI_IMAGE_MODEL:-gpt-image-2.5-sunburst}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-4000}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-1}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      # The CV service runs on the host machine, not in this compose project.
      VISION_SERVICE_BASE_URL: http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  test:
    image: maven:3.9.16-eclipse-temurin-21
    profiles: ["test"]
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: roomify
      DB_USERNAME: roomify
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      PREFERENCES_MAX_BUDGET_AMOUNT: ${PREFERENCES_MAX_BUDGET_AMOUNT:-1000000}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
    command: ["mvn", "-B", "test"]

volumes:
  postgres_data:
