# Standalone isolated PostgreSQL 17 verification; no host ports or application volume.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: roomify
      POSTGRES_USER: roomify
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local environment file}
    volumes:
      - design_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomify -d roomify"]
      interval: 2s
      timeout: 5s
      retries: 30
  test:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /app
    volumes:
      - .:/app
      - design_test_maven:/root/.m2
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: roomify
      DB_USERNAME: roomify
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your local environment file}
      STORAGE_TYPE: local
    depends_on:
      db:
        condition: service_healthy
    command: ["mvn", "-B", "test"]
volumes:
  design_test_data:
  design_test_maven:
