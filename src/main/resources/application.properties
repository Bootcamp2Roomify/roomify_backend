spring.application.name=roomify-backend

server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:roomify}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

vision-service.base-url=${VISION_SERVICE_BASE_URL:${CV_SERVICE_URL:http://localhost:8000}}
vision-service.connect-timeout=${VISION_SERVICE_CONNECT_TIMEOUT:2s}
vision-service.read-timeout=${VISION_SERVICE_READ_TIMEOUT:10s}
vision-service.analysis-path=${VISION_SERVICE_ANALYSIS_PATH:/v1/analyze}
vision-service.api-token=${VISION_SERVICE_API_TOKEN:}

# local (disk), s3, or database (bytes in Postgres; for hosts without S3 or a persistent disk)
storage.type=${STORAGE_TYPE:local}
storage.local.root=${STORAGE_LOCAL_ROOT:./storage}
storage.local.bucket=${STORAGE_LOCAL_BUCKET:local}

room-image.max-size-bytes=${ROOM_IMAGE_MAX_SIZE_BYTES:10485760}

storage.s3.bucket=${S3_BUCKET:}
storage.s3.region=${AWS_REGION:ap-southeast-2}

spring.servlet.multipart.max-file-size=${SPRING_MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${SPRING_MULTIPART_MAX_REQUEST_SIZE:12MB}

auth.jwt.secret=${JWT_SECRET:}
auth.jwt.ttl=${JWT_TTL:1h}
auth.jwt.issuer=roomify

preferences.max-budget-amount=${PREFERENCES_MAX_BUDGET_AMOUNT:1000000}

spring.config.import=optional:file:.env[.properties]

ai.provider=${AI_PROVIDER:openai}
ai.base-url=${AI_BASE_URL:https\://api.openai.com/v1}
ai.model=${AI_MODEL:gpt-4o-mini}
ai.api-key=${AI_API_KEY:${OPENAI_API_KEY:}}
ai.connect-timeout=${AI_CONNECT_TIMEOUT:5s}
ai.read-timeout=${AI_READ_TIMEOUT:180s}
ai.max-output-tokens=${AI_MAX_OUTPUT_TOKENS:4000}
ai.max-retries=${AI_MAX_RETRIES:1}
# Leave AI_TEMPERATURE empty and set AI_REASONING_EFFORT (e.g. low) for reasoning models such as gpt-6-luna.
ai.temperature=${AI_TEMPERATURE:0.1}
ai.reasoning-effort=${AI_REASONING_EFFORT:}
# Demo library (pre-written plan, stock concept photo, suggestions, DIY): AI_DEMO_MODE=true skips the provider entirely;
# AI_DEMO_FALLBACK=true answers from the library when a live call fails. Demo results are stored with provider "demo".
ai.demo-mode=${AI_DEMO_MODE:false}
ai.demo-fallback=${AI_DEMO_FALLBACK:true}

# gpt-image-1 was shut down by OpenAI on 2026-10-23.
ai.image.model=${AI_IMAGE_MODEL:gpt-image-2.5-sunburst}
ai.image.size=${AI_IMAGE_SIZE:1024x1024}
ai.image.quality=${AI_IMAGE_QUALITY:low}
design-image.max-size-bytes=${DESIGN_IMAGE_MAX_SIZE_BYTES:10485760}
