spring.application.name=roomify-backend

server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:roomify}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

vision-service.base-url=${VISION_SERVICE_BASE_URL:${CV_SERVICE_URL:http://localhost:8000}}
vision-service.connect-timeout=${VISION_SERVICE_CONNECT_TIMEOUT:2s}
vision-service.read-timeout=${VISION_SERVICE_READ_TIMEOUT:10s}
vision-service.analysis-path=${VISION_SERVICE_ANALYSIS_PATH:/v1/analyze}

storage.type=${STORAGE_TYPE:local}
storage.local.root=${STORAGE_LOCAL_ROOT:./storage}
storage.local.bucket=${STORAGE_LOCAL_BUCKET:local}

room-image.max-size-bytes=${ROOM_IMAGE_MAX_SIZE_BYTES:10485760}

storage.s3.bucket=${S3_BUCKET:}
storage.s3.region=${AWS_REGION:ap-southeast-2}

spring.servlet.multipart.max-file-size=${SPRING_MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${SPRING_MULTIPART_MAX_REQUEST_SIZE:12MB}