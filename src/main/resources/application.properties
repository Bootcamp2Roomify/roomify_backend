spring.application.name=roomify-backend

server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:roomify}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

vision-service.base-url=${VISION_SERVICE_BASE_URL:http://localhost:8000}
vision-service.connect-timeout=${VISION_SERVICE_CONNECT_TIMEOUT:2s}
vision-service.read-timeout=${VISION_SERVICE_READ_TIMEOUT:10s}
vision-service.analysis-path=${VISION_SERVICE_ANALYSIS_PATH:/api/v1/analysis}